[package]
name = "alltv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "alltv"
path = "src/lib.rs"

[[bin]]
name = "alltv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
